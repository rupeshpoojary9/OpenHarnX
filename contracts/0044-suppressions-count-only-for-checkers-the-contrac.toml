title = "Suppressions count only for checkers the contract runs"
mode = "task"
change_summary = "A suppression blocks only when the contract runs the checker it silences; conditional skips are not suppressions; suppressions not counted are listed (T90a)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_suppression_scope"
kind = "acceptance"
mandatory = true
protected = "../tests/test_suppression_scope.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
