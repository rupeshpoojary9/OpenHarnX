title = "Gate workflow trust and CI signing"
mode = "task"
change_summary = "The gate workflow signs its report as a GitHub artifact attestation in a separate job that never runs pull request code, active for public same-repository pull requests; tests guard the workflow's trust properties."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_workflow_guard"
kind = "acceptance"
mandatory = true
protected = "../tests/test_workflow_guard.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
