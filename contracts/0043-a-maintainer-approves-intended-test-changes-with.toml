title = "A maintainer approves intended test changes with a label"
mode = "task"
change_summary = "ohx gate --approve-tests-label: a label added by someone who can write, after the judged commit was pushed, lets the pull request change its tests; its own tests must pass and every approved finding is recorded with who approved it (T90b)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_test_approval"
kind = "acceptance"
mandatory = true
protected = "../tests/test_test_approval.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
