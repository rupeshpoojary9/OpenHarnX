title = "Stop hook feedback without a hook error"
mode = "task"
change_summary = "BLOCKED goes back as hookSpecificOutput.additionalContext on Claude Code 2.1.163 or later (shown as hook feedback, same loop protections); older or unknown versions are blocked as before. Corrects the stated Stop hook default timeout (600 s, not 30 s)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_claude_hook"
kind = "acceptance"
mandatory = true
protected = "../tests/test_claude_hook.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
