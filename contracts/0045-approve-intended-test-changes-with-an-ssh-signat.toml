title = "Approve intended test changes with an SSH signature"
mode = "task"
change_summary = "ohx approve-tests signs the commit's test changes as a git note; ohx gate accepts the signature for exactly that commit from a key listed in .openharnx/approvers on the base; works on any git platform (T90e)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_signed_approval"
kind = "acceptance"
mandatory = true
protected = "../tests/test_signed_approval.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
