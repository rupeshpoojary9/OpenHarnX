title = "The Stop hook tells the person every verdict and the agent what to fix"
mode = "task"
change_summary = "Every verdict from the Stop hook reaches the person as a one-line message with the report path; a BLOCKED agent gets the failing agreed tests, the error lines and where the full output is, bounded; the report names the Claude Code session, cost unknown (T98)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_hook_feedback"
kind = "acceptance"
mandatory = true
protected = "../tests/test_hook_feedback.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
