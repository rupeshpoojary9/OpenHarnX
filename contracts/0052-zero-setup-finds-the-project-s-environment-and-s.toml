title = "Zero setup finds the project's environment and says why a suite cannot run"
mode = "bugfix"
change_summary = "Without python in ohx.toml, checkers use the project's .venv or venv, else the active virtual environment; a suite that cannot run at locking fails init with the cause; a crashed check says why (T94)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_zero_setup_venv"
kind = "acceptance"
mandatory = true
protected = "../tests/test_zero_setup_venv.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
