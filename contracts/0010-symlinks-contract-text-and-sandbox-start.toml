title = "Symlinks, contract text and sandbox start"
mode = "task"
change_summary = "Candidate identity covers what symlinks resolve to; contract text of any language round-trips; a checker the sandbox did not start is unavailable, never a pass or fail."
python = ".venv/bin/python"

[[obligations]]
id = "acceptance-test_symlink_identity"
kind = "acceptance"
mandatory = true
protected = "../tests/test_symlink_identity.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "acceptance-test_contract_title_text"
kind = "acceptance"
mandatory = true
protected = "../tests/test_contract_title_text.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "acceptance-test_sandbox_start"
kind = "acceptance"
mandatory = true
protected = "../tests/test_sandbox_start.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
