title = "CI trust boundary pinned"
mode = "task"
change_summary = "Tests pin the CI boundary for RC-18 and RC-19: only the pull_request trigger, GitHub-hosted runners with time limits, no caches, no write token that could comment or push, and code under review sees no runner variables and cannot write the runner's step files under srt."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_ci_boundary"
kind = "acceptance"
mandatory = true
protected = "../tests/test_ci_boundary.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
