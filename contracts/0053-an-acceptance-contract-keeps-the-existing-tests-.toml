title = "An acceptance contract keeps the existing tests locked"
mode = "bugfix"
change_summary = "ohx contract new adds the locked copy of a Python tests folder next to the working tree's own run; TypeScript, JavaScript and Go suites run unlocked and the report says so (T95)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_contract_locks_suite"
kind = "acceptance"
mandatory = true
protected = "../tests/test_contract_locks_suite.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
