title = "TypeScript and JavaScript locally"
mode = "task"
change_summary = "The weakening check covers TypeScript and JavaScript suppressions, skipped or focused tests, fewer tests or assertions and checker configuration; TypeScript and JavaScript acceptance tests are locked and run at their own path with Vitest, Jest or node --test; any JUnit-writing runner gives per-test results through {junit}."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_typescript"
kind = "acceptance"
mandatory = true
protected = "../tests/test_typescript.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
