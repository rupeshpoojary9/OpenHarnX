title = "Linux outside CI: the report names real folders and doctor the real srt version"
mode = "bugfix"
change_summary = "Found in a Linux trial outside CI (Debian 13 arm64 container): the report named a venv's lib64 alias instead of the real site-packages folder, and doctor showed srt's printed 1.0.0 instead of the installed 0.0.77 (T108)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_ci_findings"
kind = "acceptance"
mandatory = true
protected = "../tests/test_ci_findings.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 1200
