title = "Release criteria met for 0.1.0"
mode = "task"
change_summary = "RC-17, RC-24 and RC-25 marked met with the tests and the release evidence behind them; the release line says releasable; threat model G10 mitigated by branch protection and code owners; the T100 record (T100)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_release_criteria"
kind = "acceptance"
mandatory = true
protected = "../tests/test_release_criteria.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 1200
