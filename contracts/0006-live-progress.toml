title = "Live progress"
mode = "task"
change_summary = "Never silent: state limits up front, show each agent action as it happens, end with time, cost and next step; Claude Code becomes one adapter definition."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_progress"
kind = "acceptance"
mandatory = true
protected = "../tests/test_progress.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
