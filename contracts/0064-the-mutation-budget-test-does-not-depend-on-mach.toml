title = "The mutation budget test does not depend on machine speed"
mode = "bugfix"
change_summary = "test_no_mutant_starts_once_the_budget_would_run_out accepts either some mutants skipped or none run, since how many fit in 3 s depends on the machine; it failed on the CI runner (run 37484375324) (T100)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_mutation_budget"
kind = "acceptance"
mandatory = true
protected = "../tests/test_mutation_budget.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 1200
