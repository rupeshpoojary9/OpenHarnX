title = "Release candidate 0.1.0"
mode = "task"
change_summary = "Version 0.1.0; the README opens with a first run (install, demo, protect a project, change it, read the brief) and separates what 0.1.0 supports from what is experimental, matching the release criteria; CODEOWNERS for the workflow and action; the demo cleanup test no longer fails on an operating-system cache in TMPDIR (T100)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_cheat_demo"
kind = "acceptance"
mandatory = true
protected = "../tests/test_cheat_demo.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
