title = "The mutation check spends its time where it can find something"
mode = "task"
change_summary = "Mutants are made only in changed files the acceptance tests imported, and none starts once the time budget (120 s, or mutation_budget_s in ohx.toml) would run out; the note names what was skipped. Advisory; the verdict is unchanged (T97)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_mutation_budget"
kind = "acceptance"
mandatory = true
protected = "../tests/test_mutation_budget.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
