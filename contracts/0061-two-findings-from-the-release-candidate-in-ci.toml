title = "Two findings from the release candidate in CI"
mode = "bugfix"
change_summary = "On Debian and Ubuntu Python the fingerprint finds a venv's site-packages (venv scheme, layout, site.getsitepackages) and the report names the folders; suite_timeout_s in ohx.toml sets the limit of every suite OpenHarnX adds; OpenHarnX's own suite runs in parallel in CI with room to finish (T100)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_ci_findings"
kind = "acceptance"
mandatory = true
protected = "../tests/test_ci_findings.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 1200
