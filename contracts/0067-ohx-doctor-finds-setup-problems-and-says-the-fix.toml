title = "ohx doctor finds setup problems and says the fix"
mode = "task"
change_summary = "ohx doctor also checks srt and its version, Node, the sandbox's Linux helpers, the interpreter the checks will use and whether it has pytest, and whether ohx.toml reads, each with the command that fixes it; a missing sandbox warns, a broken ohx.toml fails (T103)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_doctor_setup"
kind = "acceptance"
mandatory = true
protected = "../tests/test_doctor_setup.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 1200
