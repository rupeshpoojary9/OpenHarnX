title = "No regressions is claimed only when a regression check ran"
mode = "bugfix"
change_summary = "ohx contract new adds the project's TypeScript, JavaScript or Go suite as a regression check; the no-regressions claim comes only from regression checks, else not checked (T93)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_regression_claim"
kind = "acceptance"
mandatory = true
protected = "../tests/test_regression_claim.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
