title = "Release candidate 0.1.2"
mode = "task"
change_summary = "Version 0.1.2 with T102 to T108 since 0.1.1; the README and roadmap name it; the threat model row G19 cites its test file now that it is on main (T106)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_launch_docs"
kind = "acceptance"
mandatory = true
protected = "../tests/test_launch_docs.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 1200
