title = "ohx history refuses shallow and partial clones with the fix"
mode = "task"
change_summary = "Before any work, ohx history refuses a shallow clone (git fetch --unshallow) or a partial clone (git fetch --refetch) instead of failing every commit (T92)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_history_clones"
kind = "acceptance"
mandatory = true
protected = "../tests/test_history_clones.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
