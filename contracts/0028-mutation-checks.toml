title = "Mutation checks"
mode = "task"
change_summary = "After the acceptance tests pass, OpenHarnX mutates the changed lines of source files one at a time in a copy of the tree and reruns the acceptance tests; survivors are named in an advisory check that never changes the verdict, and a mutant counts only when the tests imported the mutated file."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_mutation"
kind = "acceptance"
mandatory = true
protected = "../tests/test_mutation.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
