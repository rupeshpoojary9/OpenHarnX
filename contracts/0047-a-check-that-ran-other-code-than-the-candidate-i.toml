title = "A check that ran other code than the candidate is invalid"
mode = "task"
change_summary = "Each pytest run records where the project's modules loaded from; a module from outside the candidate with different content makes the check invalid, so no passing verdict (T90c)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_wrong_code"
kind = "acceptance"
mandatory = true
protected = "../tests/test_wrong_code.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
