title = "Four review findings"
mode = "bugfix"
change_summary = "Orchestration never imports the candidate's modules (the Action's report parsing, the protected environment set-up); a suite with no collected tests or that did not run properly is never a pass; a pinned signer must cover every record; a timed-out agent's whole process group is stopped."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_review_findings"
kind = "acceptance"
mandatory = true
protected = "../tests/test_review_findings.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
