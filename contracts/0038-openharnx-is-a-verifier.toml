title = "OpenHarnX is a verifier"
mode = "task"
change_summary = "Owner decision 2026-10-04: staffing and planning moved to a separate project. README, package, CLI and pyproject describe OpenHarnX as a verifier of coding-agent work."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_positioning"
kind = "acceptance"
mandatory = true
protected = "../tests/test_positioning.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
