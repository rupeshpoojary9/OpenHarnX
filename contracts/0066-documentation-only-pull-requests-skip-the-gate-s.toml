title = "Documentation-only pull requests skip the gate's suite in CI"
mode = "task"
change_summary = "When only documentation changed, the gate job reports success within seconds and skips the suite, the sandbox and the signing, so the required check passes; the base branch's scripts/docs-only.sh decides; Markdown and docs/assets only, not under tests, src or contracts (T102)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_docs_only_ci"
kind = "acceptance"
mandatory = true
protected = "../tests/test_docs_only_ci.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 1200
