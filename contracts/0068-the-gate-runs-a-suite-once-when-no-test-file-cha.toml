title = "The gate runs a suite once when no test file changed"
mode = "task"
change_summary = "When a pull request changes nothing under tests/, a mandatory pytest suite over all of tests/ is the check and the locked copy and its baseline are not run; with the default suites the duplicate own run is not added; any change under tests/ or a partial suite keeps every run; the report says when a run was saved (T106)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_gate_once"
kind = "acceptance"
mandatory = true
protected = "../tests/test_gate_once.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 1200
