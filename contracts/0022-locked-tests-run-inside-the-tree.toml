title = "Locked tests run inside the tree"
mode = "task"
change_summary = "In CI the locked base tests run in a read-only copy of the tree with tests/ replaced by the locked copy, so tests that find files relative to themselves are protected (RC-31)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_locked_in_tree"
kind = "acceptance"
mandatory = true
protected = "../tests/test_locked_in_tree.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
