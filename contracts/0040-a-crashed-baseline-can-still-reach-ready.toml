title = "A crashed baseline can still reach READY"
mode = "task"
change_summary = "Found by the impossible-tasks replay: when the suite crashed or ran no tests at acceptance, a correct fix stayed UNKNOWN for ever. Now a run that passes, ran at least one test and in which every test passed counts; anything less stays not ready."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_crashed_baseline"
kind = "acceptance"
mandatory = true
protected = "../tests/test_crashed_baseline.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
