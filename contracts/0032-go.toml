title = "Go"
mode = "task"
change_summary = "Go support: weakening patterns for Go (nolint, lint:ignore, nosec, t.Skip, build constraints in tests, fewer tests or checks, removed test files, golangci and staticcheck configuration); per-test results from go test -json with failures winning; the gate locks every _test.go file of the base and runs go test; Go acceptance tests are locked and run their package."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_go"
kind = "acceptance"
mandatory = true
protected = "../tests/test_go.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
