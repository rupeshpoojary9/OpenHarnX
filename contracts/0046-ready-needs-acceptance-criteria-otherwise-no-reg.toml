title = "READY needs acceptance criteria; otherwise NO REGRESSIONS"
mode = "task"
change_summary = "Every mandatory check passing without a mandatory acceptance check is NO REGRESSIONS, not READY; the report states each claim (no regressions, acceptance, still failing) (T91)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_verdict_claims"
kind = "acceptance"
mandatory = true
protected = "../tests/test_verdict_claims.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
