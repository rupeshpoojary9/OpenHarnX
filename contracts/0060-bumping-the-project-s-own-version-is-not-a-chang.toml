title = "Bumping the project's own version is not a changed environment"
mode = "bugfix"
change_summary = "The candidate's uv.lock is compared with the accepted copy setting aside only the version line of the package whose source is the project itself; any other difference still runs nothing until a revision is accepted (T100, found by the 0.1.0 release candidate in CI)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_lock_own_version"
kind = "acceptance"
mandatory = true
protected = "../tests/test_lock_own_version.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
