title = "The report opens with a review brief"
mode = "task"
change_summary = "Every report starts with what was asked, what changed, what was verified with links to the recorded output, what remains unverified and the decisions for the reviewer, built from records only; the detail follows (T96)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_review_brief"
kind = "acceptance"
mandatory = true
protected = "../tests/test_review_brief.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
