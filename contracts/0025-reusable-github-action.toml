title = "Reusable GitHub Action"
mode = "task"
change_summary = "action.yml lets any GitHub project run the gate: it installs the gate from its own pinned source, prepares the sandbox, passes inputs through the environment, and OpenHarnX's own workflow uses it from the base."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_action"
kind = "acceptance"
mandatory = true
protected = "../tests/test_action.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
