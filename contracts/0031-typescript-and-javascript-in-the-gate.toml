title = "TypeScript and JavaScript in the gate"
mode = "task"
change_summary = "ohx gate locks every test file of the base wherever it is and runs the base's runner (Vitest, Jest or node --test); environment = npm installs packages from the base lockfile with install scripts off into the store, and a changed lockfile runs nothing."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_typescript_gate"
kind = "acceptance"
mandatory = true
protected = "../tests/test_typescript_gate.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
