title = "CI mode: ohx gate"
mode = "task"
change_summary = "ohx gate judges a pull request against its base commit: the base tests locked, the base policy, weakening against the base, a throwaway store, the report to files and the job summary; no model calls."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_gate_ci"
kind = "acceptance"
mandatory = true
protected = "../tests/test_gate_ci.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
