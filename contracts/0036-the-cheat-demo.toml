title = "The cheat demo"
mode = "task"
change_summary = "examples/cheat-demo replays an agent that edits and skips locked tests and claims success; plain pytest passes, ohx verify is BLOCKED, the genuine change READY. Report notes read cleanly."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_cheat_demo"
kind = "acceptance"
mandatory = true
protected = "../tests/test_cheat_demo.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
