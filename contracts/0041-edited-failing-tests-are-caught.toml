title = "Edited failing tests are caught"
mode = "task"
change_summary = "Found by the impossible-tasks replay: in a locked suite, a test failing at locking that is changed or removed in the working tree is a finding of the no-new-failures check, in ohx verify and ohx gate. Passing tests stay free to edit; adding tests needs no approval; the owner locks again if a test was wrong."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_edited_failing_tests"
kind = "acceptance"
mandatory = true
protected = "../tests/test_edited_failing_tests.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
