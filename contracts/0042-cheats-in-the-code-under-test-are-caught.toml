title = "Cheats in the code under test are caught"
mode = "task"
change_summary = "Tests that newly pass must also pass on their own and in reverse order; new patches of imported modules and __eq__ methods that can hide a wrong result fail the weakening check (impossible-tasks replay, source side)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_source_cheats"
kind = "acceptance"
mandatory = true
protected = "../tests/test_source_cheats.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
