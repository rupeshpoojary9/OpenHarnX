title = "Action puts uv within reach"
mode = "task"
change_summary = "The action's gate step puts its own environment on PATH so the gate finds uv and builds the protected checker environment (found by the first real run)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_action_tools"
kind = "acceptance"
mandatory = true
protected = "../tests/test_action_tools.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
