title = "OpenCode verifies when the agent goes idle"
mode = "task"
change_summary = "ohx hook install --agent opencode writes a project plugin that, on session.idle, runs ohx hook opencode-stop: the verdict as a toast, and a blocked agent sent back with what failed, at most three times in a row per session; the verdict logic is the Claude Code hook's; experimental until a live run is recorded (T104)."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_opencode_hook"
kind = "acceptance"
mandatory = true
protected = "../tests/test_opencode_hook.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 1200
