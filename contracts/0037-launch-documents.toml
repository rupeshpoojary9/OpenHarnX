title = "Launch documents"
mode = "task"
change_summary = "SECURITY.md with private vulnerability reporting and no published address; a threat model section for the gate (G1 to G13) whose cited tests must exist; docs/releasing.md and a pinned install in the README."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_launch_docs"
kind = "acceptance"
mandatory = true
protected = "../tests/test_launch_docs.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
