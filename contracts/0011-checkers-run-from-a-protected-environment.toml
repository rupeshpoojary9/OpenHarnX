title = "Checkers run from a protected environment"
mode = "task"
change_summary = "With environment uv, checkers run from an environment OpenHarnX builds from the accepted uv.lock in its own store; a changed lockfile runs nothing; otherwise the report names the .venv blind spot."
python = ".venv/bin/python"

[[obligations]]
id = "acceptance-test_protected_environment"
kind = "acceptance"
mandatory = true
protected = "../tests/test_protected_environment.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
timeout_s = 600
