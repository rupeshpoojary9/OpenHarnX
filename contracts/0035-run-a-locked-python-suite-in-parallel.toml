title = "Run a locked Python suite in parallel"
mode = "task"
change_summary = "pytest_args in ohx.toml adds the project's pytest options (such as -n auto) to the locked run and the default tests run; per-test results still decide. OpenHarnX's own suite now runs with -n auto."
python = ".venv/bin/python"
environment = "uv"

[[obligations]]
id = "acceptance-test_parallel_suite"
kind = "acceptance"
mandatory = true
protected = "../tests/test_parallel_suite.py"
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{protected}"]

[[obligations]]
id = "format"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "format", "--check", "--no-cache", "."]

[[obligations]]
id = "lint"
kind = "check"
mandatory = true
command = ["{python}", "-m", "ruff", "check", "--no-cache", "."]

[[obligations]]
id = "types"
kind = "check"
mandatory = true
command = ["{python}", "-m", "mypy", "--cache-dir", "{tmp}/mypy"]

[[obligations]]
id = "layers"
kind = "check"
mandatory = true
command = ["{bindir}/lint-imports", "--no-cache"]

[[obligations]]
id = "tests"
kind = "regression"
mandatory = true
command = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "-n", "auto"]
timeout_s = 600
