[project]
name = "openharnx"
version = "0.0.1"
description = "Delivery system that plans, staffs, controls and verifies work done by coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rupesh Poojary" }]
requires-python = ">=3.12"
dependencies = [
    "rfc8785>=0.1.4",
]

[project.scripts]
ohx = "openharnx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openharnx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "openharnx"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Kernel does not depend on outer layers"
type = "forbidden"
source_modules = ["openharnx.kernel"]
forbidden_modules = ["openharnx.cli", "openharnx.doctor", "openharnx.app"]

[[tool.importlinter.contracts]]
name = "Layers: interfaces, application, services, kernel"
type = "layers"
layers = [
    "openharnx.cli",
    "openharnx.app",
    "openharnx.verify",
    "openharnx.sandbox | openharnx.store | openharnx.workspace | openharnx.report | openharnx.doctor",
    "openharnx.kernel",
]

[[tool.importlinter.contracts]]
name = "Kernel stays pure: no I/O, clock or randomness"
type = "forbidden"
source_modules = ["openharnx.kernel"]
forbidden_modules = [
    "os",
    "subprocess",
    "socket",
    "sqlite3",
    "shutil",
    "tempfile",
    "urllib",
    "http",
    "time",
    "random",
]
