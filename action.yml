# OpenHarnX gate as a GitHub Action (T79).
#
# Use it pinned to a commit: `uses: rupeshpoojary9/OpenHarnX@<commit SHA>`. The
# gate is installed from this action's own source, so the pin is the gate's
# version; the project's code is judged, never installed. Inputs reach scripts
# only through environment variables. Needs a Linux runner (ubuntu-24.04 tested).
name: OpenHarnX gate
description: Judge a pull request against its base commit with locked tests, in a sandbox, with no model calls.

inputs:
  base:
    description: The base commit or ref (the trusted side). Defaults to the pull request's base commit.
    default: ${{ github.event.pull_request.base.sha }}
  working-directory:
    description: The checkout to judge.
    default: "."
  sandbox:
    description: srt (default) or none. Without the sandbox the report says checkers ran without isolation.
    default: srt
  out:
    description: Folder for report.json and report.md. Defaults to ohx-gate in the runner's temp folder.
    default: ""
  approve-tests-label:
    description: >-
      The label with which a maintainer approves the pull request's test changes. It counts
      when added by someone who can write, after the judged commit was pushed. Empty turns
      approvals off. Needs the actions and pull-requests read permissions.
    default: ohx-approve-tests
  token:
    description: Read-only token for looking up the label. Given to the gate process only.
    default: ${{ github.token }}

outputs:
  readiness:
    description: >-
      ready (every check passed, acceptance tests included), no-regressions (every check
      passed but no acceptance tests are agreed, so the task is not shown to be done),
      blocked, unknown or invalid.
    value: ${{ steps.gate.outputs.readiness }}
  report:
    description: The folder with report.json and report.md.
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    - name: Prepare the sandbox
      shell: bash
      run: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        if ! command -v bwrap >/dev/null || ! command -v socat >/dev/null || ! command -v rg >/dev/null; then
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat ripgrep
        fi
        command -v srt >/dev/null || npm install -g @anthropic-ai/sandbox-runtime@0.0.77

    - name: Install the gate from this action's own source
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 -m venv "$RUNNER_TEMP/ohx"
        "$RUNNER_TEMP/ohx/bin/pip" install -q uv "$ACTION_PATH"

    - name: Run the gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OHX_BASE: ${{ inputs.base }}
        OHX_SANDBOX: ${{ inputs.sandbox }}
        OHX_OUT: ${{ inputs.out || format('{0}/ohx-gate', runner.temp) }}
        OHX_SIGNING_KEY: none
        OHX_APPROVE_LABEL: ${{ inputs.approve-tests-label }}
        OHX_GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        # The gate builds the protected checker environment with uv from this environment.
        export PATH="$RUNNER_TEMP/ohx/bin:$PATH"
        base="$OHX_BASE"
        git rev-parse --verify -q "$base^{commit}" >/dev/null || { git fetch --no-tags origin "$base"; base=FETCH_HEAD; }
        # Signed approvals of test changes travel as git notes (T90e); none is fine.
        git fetch -q --no-tags origin "+refs/notes/ohx-approvals:refs/notes/ohx-approvals" 2>/dev/null || true
        set +e
        # The token stays with the gate: checkers get an explicit environment allowlist.
        "$RUNNER_TEMP/ohx/bin/ohx" gate --base "$base" --sandbox "$OHX_SANDBOX" --out "$OHX_OUT" \
          ${OHX_APPROVE_LABEL:+--approve-tests-label "$OHX_APPROVE_LABEL"}
        code=$?
        set -e
        # -I: isolated, so nothing in the pull request's folder can be imported here.
        readiness=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["readiness"])' "$OHX_OUT/report.json" 2>/dev/null || echo unknown)
        echo "report=$OHX_OUT" >> "$GITHUB_OUTPUT"
        echo "readiness=$readiness" >> "$GITHUB_OUTPUT"
        exit "$code"
