# OpenHarnX gate: judge a pull request against its base commit (T79).
#
# Trust: the gate comes from the base commit's own action.yml, which installs
# itself, never from the pull request; the pull request is checked out
# separately and only judged. Read-only
# token, no secrets, no model calls. Actions are pinned to commit SHAs.
# Test changes (T90b): a maintainer approves the pull request's intended test changes
# by adding the ohx-approve-tests label; the job reruns when that label changes. The
# label counts only from someone with push access, added after the judged commit was
# pushed. Reading labels and run records needs the actions and pull-requests read
# permissions below; all of them are read-only.
# Limit (GitHub): on pull_request the workflow file itself comes from the pull
# request. Protect it with branch protection and approval for outside
# contributors' workflows.
#
# Signing (RC-24): a separate job signs the report as a GitHub artifact
# attestation (Sigstore). It never checks out or runs pull request code, and it
# alone holds the signing permissions. GitHub signs only in public repositories
# on plans below Enterprise Cloud, and gives pull requests from forks no signing
# identity; the job summary says why a run is unsigned.
name: OpenHarnX gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  gate:
    if: >-
      ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'ohx-approve-tests' }}
    runs-on: ubuntu-24.04
    # The suite runs three times (the locked copy at acceptance and in the run, and the
    # pull request's own), about 10 minutes each under srt on this runner (T100).
    timeout-minutes: 60
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Check out the base commit (trusted; the gate comes from here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the pull request (judged, never installed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      # Documentation only: the job still reports, so the required check passes, but the
      # suite, the sandbox and the signing are skipped (T102). The base's script decides.
      - name: Decide whether only documentation changed
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if out="$(sh trusted/scripts/docs-only.sh "$BASE" "$HEAD" candidate)"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Documentation only"
              echo
              echo "Every changed file is documentation, so the gate's suite did not run:"
              echo
              printf '%s\n' "$out" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the gate (the action from the base installs itself)
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./trusted
        with:
          working-directory: candidate
          base: ${{ github.event.pull_request.base.sha }}
          sandbox: srt
          out: ${{ runner.temp }}/ohx-gate

      - name: Keep the report
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ohx-gate-report
          path: ${{ runner.temp }}/ohx-gate
          if-no-files-found: warn

      - name: Say how the report is signed
        if: always() && steps.scope.outputs.docs_only != 'true'
        env:
          PRIVATE: ${{ github.event.repository.private }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Signature"
            echo
            if [ "$PRIVATE" = "true" ]; then
              echo "Not signed: GitHub signs CI evidence only in public repositories on this plan."
            elif [ "$FORK" = "true" ]; then
              echo "Not signed: pull requests from forks get no signing identity."
            else
              echo "Signed by the sign job as a GitHub artifact attestation (Sigstore)."
              echo "Check it: \`gh attestation verify report.json -R $REPO\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sign:
    needs: gate
    if: >-
      ${{ always() && needs.gate.result != 'skipped'
      && needs.gate.outputs.docs_only != 'true'
      && !github.event.repository.private
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Fetch the report (no pull request code is checked out here)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ohx-gate-report
          path: report

      - name: Sign the report (SLSA provenance, Sigstore)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            report/report.json
            report/report.md
