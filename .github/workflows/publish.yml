# Publish a release to PyPI (T101).
#
# Trusted publishing: PyPI trusts this workflow, in this repository, in the `pypi`
# environment, so no token or password is stored. The `pypi` environment waits for the
# owner's approval and accepts only `v*` tags. The build job makes the files with the
# code's own commit checked out and refuses a version that does not match the tag; the
# upload job, the only one that may ask for a PyPI identity, never checks out or runs
# the repository's code and uploads only what the build made. `tests/test_publish.py`
# keeps these properties.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The version matches the tag
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "pyproject.toml says $version, the release tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Build the wheel and the source distribution
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/openharnx/
    permissions:
      id-token: write  # trusted publishing; also signs the files (PyPI attestations)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
